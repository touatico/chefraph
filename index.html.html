    function obtenirSaisonActuelle() {
      const mois = new Date().getMonth();
      if (mois >= 2 && mois <= 4) return "printemps";
      if (mois >= 5 && mois <= 7) return "ete";
      if (mois >= 8 && mois <= 10) return "automne";
      return "hiver";
    }

            etapes: ["Cuire fenouils et lentilles dans 500ml d'eau 25 min.", "Mixer pour un velouté onctueux.", "Servir avec les graines de courge torréfiées."],
            astuce: "Torréfie les graines de courge à sec : elles apportent le croquant qui manque toujours à un velouté."
          },
          plat: {
            nom: "Dos de cabillaud, écrasé copieux de patate douce & épinards",
            prep: 15, cuisson: 15, difficulte: 2,
            ingredients: ["320g de dos de cabillaud", "300g de patate douce", "250g de pousses d'épinards", "20g de graines de lin moulues", "15ml d'huile d'olive extra-vierge"],
            etapes: ["Cuire la patate douce 15 min et l'écraser.", "Faire tomber les épinards 2 min à la poêle.", "Cuire le cabillaud 12 min à 180°C, dresser avec les graines de lin."],
            astuce: "Le cabillaud est cuit dès qu'il se détache en gros flocons opaques : au-delà, il sèche. Surveille-le."
          }
        },
        {
          cuisine: "❄️ Hiver • Chaleur & Fer",
          entree: {
            nom: "Soupe de potiron & châtaignes",
            prep: 15, cuisson: 25, difficulte: 1,
            ingredients: ["700g de potiron", "150g de châtaignes cuites", "1 oignon", "1 cs d'huile d'olive", "Muscade"],
            etapes: ["Suer l'oignon, ajouter potiron, châtaignes et 600ml d'eau.", "Cuire 25 min et mixer avec une pointe de muscade."],
            astuce: "Écrase quelques châtaignes directement dans la soupe : elles la rendent naturellement veloutée et gourmande."
          },
          plat: {
            nom: "Bœuf mijoté aux carottes & purée de céleri",
            prep: 20, cuisson: 90, difficulte: 3,
            ingredients: ["400g de bœuf à braiser", "4 carottes", "1 céleri-rave", "2 oignons", "400ml de bouillon", "1 cs d'huile d'olive", "Thym & laurier"],
            etapes: ["Saisir le bœuf de tous côtés, réserver.", "Faire suer oignons et carottes, remettre la viande, mouiller au bouillon.", "Mijoter 1h30 à feu doux. Cuire le céleri à part et l'écraser à l'huile d'olive."],
            astuce: "Le mijoté n'aime pas la précipitation : feu très doux et couvercle. C'est le temps, pas la puissance, qui attendrit la viande."
          }
        },
        {
          cuisine: "❄️ Hiver • Poisson & Racines",
          entree: {
            nom: "Velouté de panais à la noisette",
            prep: 10, cuisson: 25, difficulte: 1,
            ingredients: ["500g de panais", "1 oignon", "30g de noisettes", "1 cs d'huile d'olive", "Muscade"],
            etapes: ["Suer l'oignon, ajouter le panais et 600ml d'eau.", "Cuire 25 min, mixer et parsemer de noisettes concassées."],
            astuce: "Une pointe de muscade fraîchement râpée sublime la douceur naturellement sucrée du panais."
          },
          plat: {
            nom: "Dos de lieu, poireaux fondants & pommes de terre vapeur",
            prep: 15, cuisson: 25, difficulte: 2,
            ingredients: ["2 dos de lieu noir", "3 poireaux", "400g de pommes de terre", "1 citron", "15ml d'huile d'olive"],
            etapes: ["Cuire les pommes de terre à la vapeur.", "Faire fondre les poireaux émincés à couvert 15 min.", "Cuire le lieu 10 min à la vapeur ou au four, servir avec le citron."],
            astuce: "Fais fondre les poireaux à couvert et à feu doux : ils deviennent soyeux sans jamais brûler ni colorer."
          }
        },
        {
          cuisine: "❄️ Hiver • Légumineuses",
          entree: {
            nom: "Soupe de pois cassés",
            prep: 10, cuisson: 45, difficulte: 1,
            ingredients: ["200g de pois cassés", "1 carotte", "1 oignon", "1 feuille de laurier", "1 cs d'huile d'olive"],
            etapes: ["Suer oignon et carotte, ajouter les pois cassés, le laurier et 1L d'eau.", "Cuire 45 min et mixer si désiré."],
            astuce: "Pas besoin de trempage pour les pois cassés, mais écume la mousse qui monte au début : la soupe sera plus digeste."
          },
          plat: {
            nom: "Curry de pois chiches, épinards & riz complet",
            prep: 10, cuisson: 20, difficulte: 1,
            ingredients: ["250g de pois chiches cuits", "200g d'épinards", "150g de riz complet", "120ml de lait de coco", "1 cs de curry", "1 oignon", "1 cs d'huile d'olive"],
            etapes: ["Faire revenir oignon et curry, ajouter pois chiches et lait de coco.", "Mijoter 12 min, incorporer les épinards en fin de cuisson.", "Servir avec le riz complet."],
            astuce: "Ajoute les épinards en tout dernier : 2 minutes suffisent pour qu'ils tombent sans devenir tristes."
          }
        }
      ]
    };

    const recetteShabbat = {
      cuisine: "✡️ Shabbat Équilibré & Copieux",
      entree: {
        nom: "Matbucha maison & carottes au cumin",
        prep: 15, cuisson: 30, difficulte: 2,
        ingredients: ["5 tomates mûres", "3 poivrons grillés", "4 carottes", "1.5 cs d'huile d'olive", "Ail, cumin, paprika"],
        etapes: ["Mijoter tomates et poivrons avec l'ail et l'huile 30 min à feu doux.", "Bouillir les carottes en rondelles et assaisonner à cru au cumin, citron et ail."],
        astuce: "La matbucha est meilleure préparée la veille : au repos, les saveurs se concentrent et le plat prend du corps."
      },
      plat: {
        nom: "Poulet rôti bio aux citrons confits, curcuma & patates douces",
        prep: 20, cuisson: 50, difficulte: 2,
        ingredients: ["1 poulet bio entier (ou 4 grosses cuisses)", "400g de patates douces", "3 citrons confits", "2 oignons", "1.5 cs d'huile d'olive", "1 cs de curcuma"],
        etapes: ["Disposer poulet, oignons et patates douces dans un grand plat.", "Masser avec l'huile, le curcuma et les citrons confits.", "Enfourner 50 min à 190°C."],
        astuce: "Arrose le poulet de son jus à mi-cuisson : la peau dore uniformément et la chair reste moelleuse."
      }
    };

    /* ============================================================
       3. HELPERS
    ============================================================ */
    const DIFFICULTES = {
      1: { label: "Facile",        classe: "bg-emerald-50 text-emerald-700" },
      2: { label: "Intermédiaire", classe: "bg-amber-50 text-amber-700" },
      3: { label: "Corsé",         classe: "bg-rose-50 text-rose-700" }
    };

    function formatTemps(min) {
      if (!min || min <= 0) return "—";
      if (min < 60) return `${min} min`;
      const h = Math.floor(min / 60), m = min % 60;
      return m ? `${h} h ${String(m).padStart(2, "0")}` : `${h} h`;
    }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    /* --- Rangement de la liste de courses par rayon (heuristique) --- */
    const RAYONS = [
      { nom: "🥬 Fruits & Légumes", mots: ["asperge","radis","épinard","courgette","tomate","poivron","concombre","aubergine","carotte","fenouil","petits pois","fèves","avocat","patate douce","potimarron","butternut","champignon","panais","poireau","oignon","échalote","ail","citron vert","basilic","menthe","coriandre","aneth","persil","ciboulette","gingembre","pousses","mesclun","salade","maïs","châtaigne","potiron","céleri"] },
      { nom: "🐟 Poissons & Viandes", mots: ["poulet","truite","saumon","cabillaud","dinde","bœuf","boeuf","lieu","dorade","poisson","cuisse"] },
      { nom: "🧀 Frais & Crèmerie", mots: ["feta","mozzarella","yaourt","œuf","oeuf","tofu","edamame","houmous"] },
      { nom: "🌾 Épicerie & Secs", mots: ["quinoa","riz","boulgour","lentille","pois chiche","pois cassé","haricot","tahini","huile","vinaigre","graine","sésame","noix","noisette","pignon","curcuma","cumin","curry","paprika","zaatar","tamari","soja","sauce","chocolat","citron confit","lait de coco","muscade","moutarde","balsamique","laurier","thym","bouillon","épices","pita","challah","pain"] }
    ];
    const ORDRE_RAYONS = ["🥬 Fruits & Légumes","🐟 Poissons & Viandes","🧀 Frais & Crèmerie","🌾 Épicerie & Secs","🛒 Autres"];
    function rayonPour(ing) {
      const s = ing.toLowerCase();
      for (const r of RAYONS) if (r.mots.some(m => s.includes(m))) return r.nom;
      return "🛒 Autres";
    }

    /* ============================================================
       4. PERSISTANCE (localStorage, avec repli mémoire si indispo)
    ============================================================ */
    const STORAGE_KEY = "menu-market-v2";
    function safeGet() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { return null; } }
    function safeSet(obj) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch {} }
    function persister() { safeSet({ menuSemaine, etatStock, jourDebutCourses, saison: saisonActuelle }); }

    /* ============================================================
       5. GÉNÉRATION DU MENU
    ============================================================ */
    const saisonActuelle = obtenirSaisonActuelle();
    const poolRecettesSaison = catalogueSaisons[saisonActuelle] || catalogueSaisons["printemps"];

    function tirerRecette(pool, exclureNom) {
      const dispo = pool.filter(r => r.plat.nom !== exclureNom);
      const source = dispo.length ? dispo : pool;
      return source[Math.floor(Math.random() * source.length)];
    }
    function genererMenuSemaineDynamique() {
      const jours = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi (Shabbat)","Samedi","Dimanche"];
      let dernier = null;
      return jours.map((jour, index) => {
        if (index === 4) return { id: index, jour, ...recetteShabbat };
        const r = tirerRecette(poolRecettesSaison, dernier);
        dernier = r.plat.nom;
        return { id: index, jour, ...r };
      });
    }

    let menuSemaine, etatStock, jourDebutCourses;
    const sauvegarde = safeGet();
    if (sauvegarde && Array.isArray(sauvegarde.menuSemaine) && sauvegarde.menuSemaine.length) {
      menuSemaine = sauvegarde.menuSemaine;
      etatStock = sauvegarde.etatStock || {};
      jourDebutCourses = sauvegarde.jourDebutCourses || 0;
    } else {
      menuSemaine = genererMenuSemaineDynamique();
      etatStock = {};
      jourDebutCourses = 0;
    }

    /* ============================================================
       6. RENDU — MENU
    ============================================================ */
    function ligneMeta(plat) {
      const d = DIFFICULTES[plat.difficulte] || DIFFICULTES[1];
      return `<div class="flex items-center gap-2 mt-1">
        <span class="text-[10px] font-bold text-slate-500">⏱️ ${formatTemps(plat.prep + plat.cuisson)}</span>
        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${d.classe}">${d.label}</span>
      </div>`;
    }

    function rendreMenu() {
      document.getElementById("header-saison").innerText = `Chef Personnel • Saison ${cap(saisonActuelle)}`;
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      menuSemaine.forEach((item, index) => {
        const estShabbat = item.jour.includes("Vendredi");
        container.innerHTML += `
          <div class="bg-white rounded-2xl p-5 custom-shadow border border-slate-100 transition duration-200">
            <div class="flex justify-between items-center mb-3">
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-sm text-slate-900">${item.jour}</span>
                ${estShabbat ? '<span class="badge-shabbat text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">Shabbat</span>' : ''}
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">${item.cuisine}</span>
                <button data-regen="${index}" class="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition" title="Changer ce plat">🔄</button>
              </div>
            </div>

            <div class="space-y-2.5 text-xs">
              <div class="bg-slate-50 p-2.5 rounded-xl flex justify-between items-center gap-2">
                <div class="min-w-0">
                  <span class="text-[10px] font-bold text-slate-400 uppercase">Entrée</span>
                  <p class="font-bold text-slate-800 leading-tight">${item.entree.nom}</p>
                  ${ligneMeta(item.entree)}
                </div>
                <button data-modal="${index}" data-type="entree" class="shrink-0 text-emerald-600 hover:text-emerald-700 font-bold px-2 py-1 bg-white rounded-lg border border-slate-200/60">Voir</button>
              </div>

              <div class="bg-emerald-50/50 p-2.5 rounded-xl flex justify-between items-center gap-2 border border-emerald-100/50">
                <div class="min-w-0">
                  <span class="text-[10px] font-bold text-emerald-600 uppercase">Plat principal</span>
                  <p class="font-bold text-slate-900 leading-tight">${item.plat.nom}</p>
                  ${ligneMeta(item.plat)}
                </div>
                <button data-modal="${index}" data-type="plat" class="shrink-0 text-white bg-emerald-600 hover:bg-emerald-700 font-bold px-2.5 py-1 rounded-lg shadow-sm">Voir</button>
              </div>
            </div>

            <details class="mt-3 group">
              <summary class="text-[11px] font-bold text-slate-400 hover:text-slate-600 cursor-pointer list-none flex justify-between items-center pt-2 border-t border-slate-50">
                <span>🛒 Ingrédients de ${item.jour.split(' ')[0]}</span>
                <span class="transition group-open:rotate-180">▼</span>
              </summary>
              <div class="mt-2 text-xs bg-slate-50 p-2.5 rounded-xl">
                <div class="flex flex-wrap gap-1">
                  ${[...item.entree.ingredients, ...item.plat.ingredients].map(ing => `<span class="bg-white px-2 py-0.5 rounded border border-slate-200 text-slate-600 text-[11px]">${ing}</span>`).join('')}
                </div>
              </div>
            </details>
          </div>`;
      });

      rendreFiltresJours();
      rendreCourses();
    }

    /* ============================================================
       7. MODAL RECETTE
    ============================================================ */
    function statCard(label, valeur, extraClasse) {
      return `<div class="rounded-xl p-2.5 text-center ${extraClasse || 'bg-slate-50'}">
        <p class="text-[9px] font-bold uppercase tracking-wider opacity-70">${label}</p>
        <p class="text-sm font-extrabold mt-0.5">${valeur}</p>
      </div>`;
    }

    function ouvrirModal(jourIndex, type) {
      const item = menuSemaine[jourIndex];
      const data = type === "entree" ? item.entree : item.plat;
      const d = DIFFICULTES[data.difficulte] || DIFFICULTES[1];

      document.getElementById("modal-badge").innerText = `${item.jour.split(' ')[0]} • ${type === "entree" ? "Entrée" : "Plat Principal"}`;
      document.getElementById("modal-title").innerText = data.nom;

      document.getElementById("modal-stats").innerHTML =
        statCard("Préparation", formatTemps(data.prep)) +
        statCard("Cuisson", formatTemps(data.cuisson)) +
        statCard("Difficulté", d.label, d.classe);

      document.getElementById("modal-ingredients").innerHTML = data.ingredients.map(ing => `
        <li class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>
          <span>${ing}</span>
        </li>`).join('');

      document.getElementById("modal-etapes").innerHTML = data.etapes.map(et => `<li class="pl-1">${et}</li>`).join('');

      document.getElementById("modal-astuce").innerHTML = data.astuce ? `
        <div class="bg-amber-50 border border-amber-100 rounded-xl p-3.5">
          <p class="text-[10px] font-extrabold text-amber-700 uppercase tracking-wider mb-1">💡 Le geste du chef</p>
          <p class="text-xs text-amber-900 leading-relaxed">${data.astuce}</p>
        </div>` : '';

      document.getElementById("modal-recette").classList.remove("hidden");
    }
    document.getElementById("close-modal").addEventListener("click", () => document.getElementById("modal-recette").classList.add("hidden"));
    document.getElementById("modal-recette").addEventListener("click", (e) => { if (e.target.id === "modal-recette") e.currentTarget.classList.add("hidden"); });

    /* ============================================================
       8. REGÉNÉRATION
    ============================================================ */
    function regenererJour(index) {
      if (index === 4) return; // Shabbat verrouillé
      const r = tirerRecette(poolRecettesSaison, menuSemaine[index].plat.nom);
      menuSemaine[index] = { ...menuSemaine[index], cuisine: r.cuisine, entree: r.entree, plat: r.plat };
      persister();
      rendreMenu();
    }

    /* ============================================================
       9. LISTE DE COURSES
    ============================================================ */
    function rendreFiltresJours() {
      const container = document.getElementById("days-filter");
      container.innerHTML = "";
      menuSemaine.forEach((item, idx) => {
        const active = idx >= jourDebutCourses;
        container.innerHTML += `
          <button data-jour="${idx}" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${active ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">
            ${item.jour.split(' ')[0]}
          </button>`;
      });
    }

    function definirJourDebut(idx) {
      jourDebutCourses = idx;
      persister();
      rendreFiltresJours();
      rendreCourses();
    }

    function itemHTML(ing, achete) {
      return `
        <label class="flex items-center gap-3 py-2.5 cursor-pointer group">
          <input type="checkbox" data-ing="${ing}" ${achete ? 'checked' : ''} class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 border-slate-300">
          <span class="text-xs font-semibold ${achete ? 'line-through text-slate-400' : 'text-slate-700 group-hover:text-slate-900'}">${ing}</span>
        </label>`;
    }

    function rendreCourses() {
      const joursAffiches = menuSemaine.slice(jourDebutCourses);
      document.getElementById("active-days-tag").innerText = `${joursAffiches[0].jour.split(' ')[0]} → ${joursAffiches[joursAffiches.length - 1].jour.split(' ')[0]}`;

      const tousIngs = [];
      joursAffiches.forEach(m => tousIngs.push(...m.entree.ingredients, ...m.plat.ingredients));
      const ingsUniques = [...new Set(tousIngs)];

      const aAcheter = ingsUniques.filter(i => !etatStock[i]);
      const achetes = ingsUniques.filter(i => etatStock[i]);

      // Groupement par rayon
      const groupes = {};
      aAcheter.forEach(i => { const r = rayonPour(i); (groupes[r] = groupes[r] || []).push(i); });

      const listAcheter = document.getElementById("list-a-acheter");
      listAcheter.innerHTML = ORDRE_RAYONS
        .filter(r => groupes[r] && groupes[r].length)
        .map(r => `
          <div>
            <p class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">${r}</p>
            <div class="divide-y divide-slate-50">${groupes[r].map(i => itemHTML(i, false)).join('')}</div>
          </div>`).join('') || '<p class="text-xs text-slate-400 py-2">Tout est dans le panier ✅</p>';

      const listStock = document.getElementById("list-en-stock");
      listStock.innerHTML = achetes.length
        ? achetes.map(i => itemHTML(i, true)).join('')
        : '<p class="text-xs text-slate-300 py-2">Rien coché pour l\'instant.</p>';

      document.getElementById("count-a-acheter").innerText = aAcheter.length;

      // Progression
      const total = ingsUniques.length;
      const done = achetes.length;
      document.getElementById("progress-label").innerText = `${done} / ${total} achetés`;
      document.getElementById("progress-bar").style.width = total ? `${Math.round(done / total * 100)}%` : "0%";
    }

    function toggleStock(ing) {
      etatStock[ing] = !etatStock[ing];
      persister();
      rendreCourses();
    }

    /* ============================================================
       10. ÉVÉNEMENTS (délégation — gère aussi les apostrophes)
    ============================================================ */
    document.getElementById("cards-container").addEventListener("click", (e) => {
      const regen = e.target.closest("[data-regen]");
      if (regen) { regenererJour(Number(regen.dataset.regen)); return; }
      const modal = e.target.closest("[data-modal]");
      if (modal) { ouvrirModal(Number(modal.dataset.modal), modal.dataset.type); }
    });

    document.getElementById("days-filter").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-jour]");
      if (btn) definirJourDebut(Number(btn.dataset.jour));
    });

    document.getElementById("section-courses").addEventListener("change", (e) => {
      if (e.target.matches("input[data-ing]")) toggleStock(e.target.dataset.ing);
    });

    document.getElementById("btn-vider-panier").addEventListener("click", () => {
      etatStock = {};
      persister();
      rendreCourses();
    });

    document.getElementById("btn-reset-all").addEventListener("click", () => {
      if (confirm("Générer une toute nouvelle semaine (saison en cours) ? Ta liste de courses sera remise à zéro.")) {
        menuSemaine = genererMenuSemaineDynamique();
        etatStock = {};
        jourDebutCourses = 0;
        persister();
        rendreMenu();
      }
    });

    function setTab(tab) {
      const menu = tab === "menu";
      document.getElementById("section-menu").classList.toggle("hidden", !menu);
      document.getElementById("section-courses").classList.toggle("hidden", menu);
      document.getElementById("tab-menu").className = "w-1/2 py-2.5 rounded-xl transition-all duration-200 " + (menu ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700");
      document.getElementById("tab-courses").className = "w-1/2 py-2.5 rounded-xl transition-all duration-200 " + (menu ? "text-slate-500 hover:text-slate-700" : "bg-white text-slate-900 shadow-sm");
    }
    document.getElementById("tab-menu").addEventListener("click", () => setTab("menu"));
    document.getElementById("tab-courses").addEventListener("click", () => setTab("courses"));

    /* INIT */
    rendreMenu();
  </script>
</body>
</html>

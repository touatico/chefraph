      const mois = new Date().getMonth();
      if (mois >= 2 && mois <= 4) return "printemps";

      if (mois >= 8 && mois <= 10) return "automne";
      return "hiver";

    function formatTemps(min) {
      if (!min || min <= 0) return "—";
      if (min < 60) return `${min} min`;
      const h = Math.floor(min / 60), m = min % 60;
      return m ? `${h} h ${String(m).padStart(2, "0")}` : `${h} h`;
    }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function tempsRepas(item) { return item.entree.prep + item.plat.prep + Math.max(item.entree.cuisson, item.plat.cuisson); }

    const RAYONS = [
      { nom: "🥬 Fruits & Légumes", mots: ["asperge","radis","épinard","courgette","tomate","poivron","concombre","aubergine","carotte","fenouil","fèves","avocat","patate douce","potimarron","champignon","poireau","pomme de terre","oignon","échalote","ail","citron","basilic","menthe","coriandre","persil","gingembre","fraise","pêche","melon","pastèque","poire","pomme","orange","kiwi","figue","datte"] },
      { nom: "🐟 Poissons & Viandes", mots: ["poulet","saumon","cabillaud","dinde","bœuf","boeuf","thon"] },
      { nom: "🧀 Frais & Crèmerie", mots: ["feta","mozzarella","yaourt","œuf","oeuf","tofu","edamame","chèvre","beurre"] },
      { nom: "🌾 Épicerie & Secs", mots: ["quinoa","riz","boulgour","semoule","lentille","pois chiche","tahini","huile","vinaigre","graine","sésame","noix","noisette","miel","cannelle","curcuma","cumin","curry","paprika","zaatar","citron confit","lait de coco","moutarde","olive"] }
    ];
    const ORDRE_RAYONS = ["🥬 Fruits & Légumes","🐟 Poissons & Viandes","🧀 Frais & Crèmerie","🌾 Épicerie & Secs","🛒 Autres"];
    
    function rayonPour(ing) {
      const s = ing.toLowerCase();
      for (const r of RAYONS) if (r.mots.some(m => s.includes(m))) return r.nom;
      return "🛒 Autres";
    }
    function ingredientsDuJour(item) {
      return [...item.entree.ingredients, ...item.plat.ingredients, ...(item.dessert ? item.dessert.ingredients : [])];
    }

    const STORAGE_KEY = "menu-market-v8";
    function safeGet() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { return null; } }
    function safeSet(obj) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch {} }
    function persister() { safeSet({ menuSemaine, etatStock, joursSelectionnes, jourActiveIndex }); }

    const saisonActuelle = obtenirSaisonActuelle();
    const poolRecettesSaison = catalogueSaisons[saisonActuelle] || catalogueSaisons["printemps"];

    function tirerRecette(pool, exclureNom) {
      const dispo = pool.filter(r => r.plat.nom !== exclureNom);
      const source = dispo.length ? dispo : pool;
      return source[Math.floor(Math.random() * source.length)];
    }

    function genererMenuSemaineDynamique() {
      const jours = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi (Shabbat)","Samedi","Dimanche"];
      let dernier = null;
      return jours.map((jour, index) => {
        if (index === 4) {
          const shab = recettesShabbat[Math.floor(Math.random() * recettesShabbat.length)];
          return { id: index, jour, ...shab };
        }
        const r = tirerRecette(poolRecettesSaison, dernier);
        dernier = r.plat.nom;
        return { id: index, jour, ...r };
      });
    }

    let menuSemaine, etatStock, joursSelectionnes, jourActiveIndex;
    const sauvegarde = safeGet();
    if (sauvegarde && Array.isArray(sauvegarde.menuSemaine) && sauvegarde.menuSemaine.length) {
      menuSemaine = sauvegarde.menuSemaine;
      etatStock = sauvegarde.etatStock || {};
      joursSelectionnes = sauvegarde.joursSelectionnes || [0, 1, 2, 3, 4, 5, 6];
      jourActiveIndex = sauvegarde.jourActiveIndex !== undefined ? sauvegarde.jourActiveIndex : meGetJourActuelIndex();
    } else {
      menuSemaine = genererMenuSemaineDynamique();
      etatStock = {};
      joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
      jourActiveIndex = meGetJourActuelIndex();
    }

    function meLigneMeta(plat) {
      const d = DIFFICULTES[plat.difficulte] || DIFFICULTES[1];
      return `<div class="flex items-center gap-2 mt-1.5">
        <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200/50">⏱️ ${formatTemps(plat.prep + plat.cuisson)}</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${d.classe}">${d.label}</span>
      </div>`;
    }

    // AFFICHER LE SELECTEUR DE JOURS (Vue Jour par Jour)
    function rendreSélecteurDeJours() {
      const container = document.getElementById("day-selector");
      const jourAujourdhuiIdx = meGetJourActuelIndex();

      container.innerHTML = menuSemaine.map((item, idx) => {
        const estActif = idx === jourActiveIndex;
        const estAujourdhui = idx === jourAujourdhuiIdx;
        return `
          <button data-select-day="${idx}" class="flex-1 min-w-[70px] py-2.5 px-3 rounded-2xl flex flex-col items-center justify-center transition-all ${estActif ? 'bg-slate-900 text-white shadow-md scale-105' : 'bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50'}">
            <span class="text-[9px] font-extrabold uppercase tracking-wider ${estActif ? 'text-emerald-400' : 'text-slate-400'}">
              ${estAujourdhui ? 'Aujourd\'hui' : item.jour.split(' ')[0]}
            </span>
            <span class="text-xs font-bold mt-0.5">${item.jour.substring(0, 3)}</span>
          </button>`;
      }).join('');
    }

    // RENDRE LE FOCUS DU JOUR (Grande carte immersive)
    function rendreVueJour() {
      rendreSélecteurDeJours();
      const item = menuSemaine[jourActiveIndex];
      const estShabbat = item.jour.includes("Vendredi");
      const t = tempsRepas(item);

      const container = document.getElementById("card-day-focus");
      container.innerHTML = `
        <div class="bg-white rounded-3xl p-6 card-shadow border border-slate-200/80 space-y-5 animate-in fade-in duration-300">
          <div class="flex justify-between items-start gap-3 border-b border-slate-100 pb-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-emerald-600 uppercase tracking-wider">${item.cuisine}</span>
                ${estShabbat ? '<span class="badge-shabbat text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">Shabbat</span>' : ''}
              </div>
              <h2 class="text-2xl font-black text-slate-900 tracking-tight mt-0.5">${item.jour}</h2>
            </div>
            <button data-regen="${jourActiveIndex}" class="p-2.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-2xl transition active:scale-95 border border-slate-100" title="Changer le repas de ce jour">
              🔄
            </button>
          </div>

          <div class="space-y-3">
            <!-- Entrée -->
            <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center gap-3 border border-slate-100 hover:border-slate-200 transition">
              <div class="min-w-0">
                <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">🥗 Entrée</span>
                <h3 class="font-bold text-slate-900 text-sm leading-snug mt-0.5">${item.entree.nom}</h3>
                ${meLigneMeta(item.entree)}
              </div>
              <button data-modal="${jourActiveIndex}" data-type="entree" class="shrink-0 text-emerald-700 hover:text-emerald-800 font-bold text-xs px-3.5 py-2 bg-white rounded-xl border border-slate-200 shadow-sm active:scale-95 transition">Recette ➔</button>
            </div>

            <!-- Plat -->
            <div class="bg-emerald-50/50 p-4 rounded-2xl flex justify-between items-center gap-3 border border-emerald-100 hover:border-emerald-200 transition">
              <div class="min-w-0">
                <span class="text-[10px] font-extrabold text-emerald-600 uppercase tracking-wider">🥘 Plat principal</span>
                <h3 class="font-bold text-slate-900 text-sm leading-snug mt-0.5">${item.plat.nom}</h3>
                ${meLigneMeta(item.plat)}
              </div>
              <button data-modal="${jourActiveIndex}" data-type="plat" class="shrink-0 text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-xs px-3.5 py-2 rounded-xl shadow-sm active:scale-95 transition">Recette ➔</button>
            </div>

            <!-- Dessert -->
            ${item.dessert ? `
            <div class="bg-rose-50/40 p-3.5 rounded-2xl border border-rose-100 flex justify-between items-center">
              <div>
                <span class="text-[10px] font-extrabold text-rose-500 uppercase tracking-wider">🍰 Dessert</span>
                <p class="font-bold text-slate-800 text-xs mt-0.5">${item.dessert.nom}</p>
              </div>
              <span class="text-[10px] font-bold text-slate-400 bg-white px-2 py-1 rounded-lg border border-rose-100">⏱️ ${formatTemps(item.dessert.prep)}</span>
            </div>` : ''}
          </div>

          <!-- Ingrédients du jour -->
          <div class="pt-2">
            <h4 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">🛒 Ingrédients pour ce jour</h4>
            <div class="flex flex-wrap gap-1.5">
              ${ingredientsDuJour(item).map(ing => `<span class="bg-slate-100/80 px-2.5 py-1 rounded-xl text-slate-700 text-[11px] font-semibold border border-slate-200/50">${ing}</span>`).join('')}
            </div>
          </div>
        </div>`;
    }

    // RENDRE LA GRILLE SEMAINE (Vue d'ensemble)
    function rendreVueSemaine() {
      const container = document.getElementById("cards-grid-container");
      container.innerHTML = menuSemaine.map((item, index) => `
        <div class="bg-white rounded-2xl p-4 card-shadow border border-slate-200/60 space-y-3 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start">
              <span class="font-extrabold text-slate-900 text-sm">${item.jour}</span>
              <button data-regen="${index}" class="text-slate-400 hover:text-emerald-600 p-1 text-xs">🔄</button>
            </div>
            <p class="text-[10px] font-bold text-emerald-600 mt-0.5">${item.cuisine}</p>
            
            <div class="mt-3 space-y-2 text-xs">
              <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Entrée</p>
                <p class="font-bold text-slate-800 truncate">${item.entree.nom}</p>
              </div>
              <div class="bg-emerald-50/40 p-2.5 rounded-xl border border-emerald-100">
                <p class="text-[9px] font-bold text-emerald-600 uppercase">Plat</p>
                <p class="font-bold text-slate-900 truncate">${item.plat.nom}</p>
              </div>
            </div>
          </div>
          <button data-switch-to-day="${index}" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px] rounded-xl transition">Voir détails & recettes ➔</button>
        </div>`).join('');
    }

    function rendreMenuComplet() {
      document.getElementById("header-saison").innerText = `Chef Personnel • ${cap(saisonActuelle)}`;
      rendreVueJour();
      rendreVueSemaine();
      rendreFiltresJours();
      rendreCourses();
    }

    function statCard(label, valeur, extraClasse) {
      return `<div class="rounded-2xl p-3 text-center border ${extraClasse || 'bg-slate-50 border-slate-100'}">
        <p class="text-[9px] font-extrabold uppercase tracking-wider opacity-60">${label}</p>
        <p class="text-xs font-extrabold mt-0.5">${valeur}</p>
      </div>`;
    }

    function ouvrirModal(jourIndex, type) {
      const item = menuSemaine[jourIndex];
      const data = type === "entree" ? item.entree : item.plat;
      const d = DIFFICULTES[data.difficulte] || DIFFICULTES[1];

      document.getElementById("modal-badge").innerText = `${item.jour.split(' ')[0]} • ${type === "entree" ? "Entrée" : "Plat Principal"}`;
      document.getElementById("modal-title").innerText = data.nom;

      document.getElementById("modal-stats").innerHTML =
        statCard("Préparation", formatTemps(data.prep)) +
        statCard("Cuisson", formatTemps(data.cuisson)) +
        statCard("Niveau", d.label, d.classe);

      const matWrap = document.getElementById("modal-materiel-wrap");
      const matEl = document.getElementById("modal-materiel");
      if (data.materiel && data.materiel.length) {
        matWrap.classList.remove("hidden");
        matEl.innerHTML = data.materiel.map(m => `<span class="bg-slate-100/80 text-slate-700 px-2.5 py-1 rounded-xl text-[11px] font-semibold border border-slate-200/60">🔨 ${m}</span>`).join('');
      } else {
        matWrap.classList.add("hidden");
      }

      document.getElementById("modal-ingredients").innerHTML = data.ingredients.map(ing => `
        <li class="flex items-center gap-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
          <span>${ing}</span>
        </li>`).join('');

      const mepWrap = document.getElementById("modal-miseenplace-wrap");
      const mepEl = document.getElementById("modal-miseenplace");
      if (data.miseenplace && data.miseenplace.length) {
        mepWrap.classList.remove("hidden");
        mepEl.innerHTML = data.miseenplace.map(m => `<li class="flex items-start gap-2 bg-slate-50/70 p-2.5 rounded-xl border border-slate-100"><span class="text-emerald-600 font-bold shrink-0">✓</span><span>${m}</span></li>`).join('');
      } else {
        mepWrap.classList.add("hidden");
      }

      document.getElementById("modal-etapes").innerHTML = data.etapes.map(et => `<li class="pl-1 leading-relaxed">${et}</li>`).join('');

      document.getElementById("modal-astuce").innerHTML = data.astuce ? `
        <div class="bg-amber-50/70 border border-amber-200/60 rounded-2xl p-4 space-y-1">
          <p class="text-[10px] font-extrabold text-amber-700 uppercase tracking-wider flex items-center gap-1.5">
            <span>💡</span> Le geste du chef
          </p>
          <p class="text-xs text-amber-900 leading-relaxed font-medium">${data.astuce}</p>
        </div>` : '';

      document.getElementById("modal-recette").classList.remove("hidden");
    }

    document.getElementById("close-modal").addEventListener("click", () => document.getElementById("modal-recette").classList.add("hidden"));
    document.getElementById("modal-recette").addEventListener("click", (e) => { if (e.target.id === "modal-recette") e.currentTarget.classList.add("hidden"); });

    function regenererJour(index) {
      if (index === 4) {
        const shab = recettesShabbat[Math.floor(Math.random() * recettesShabbat.length)];
        menuSemaine[index] = { id: index, jour: menuSemaine[index].jour, ...shab };
      } else {
        const r = tirerRecette(poolRecettesSaison, menuSemaine[index].plat.nom);
        menuSemaine[index] = { ...menuSemaine[index], cuisine: r.cuisine, entree: r.entree, plat: r.plat, dessert: r.dessert };
      }
      persister();
      rendreMenuComplet();
    }

    function rendreFiltresJours() {
      const container = document.getElementById("days-filter");
      container.innerHTML = menuSemaine.map((item, idx) => {
        const active = joursSelectionnes.includes(idx);
        return `
          <button data-jour="${idx}" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${active ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200/70'}">
            ${item.jour.split(' ')[0]}
          </button>`;
      }).join('');

      document.getElementById("btn-toggle-all-days").innerText = joursSelectionnes.length === 7 ? "Tout décocher" : "Tout sélectionner";
    }

    function toggleJourSelection(idx) {
      if (joursSelectionnes.includes(idx)) {
        if (joursSelectionnes.length > 1) joursSelectionnes = joursSelectionnes.filter(i => i !== idx);
      } else {
        joursSelectionnes.push(idx);
        joursSelectionnes.sort((a,b) => a - b);
      }
      persister();
      rendreFiltresJours();
      rendreCourses();
    }

    function itemHTML(ing, achete) {
      return `
        <label class="flex items-center gap-3 py-2.5 cursor-pointer group">
          <input type="checkbox" data-ing="${ing}" ${achete ? 'checked' : ''} class="w-4 h-4 rounded-md text-emerald-600 focus:ring-emerald-500 border-slate-300 transition">
          <span class="text-xs font-semibold transition ${achete ? 'line-through text-slate-400' : 'text-slate-700 group-hover:text-slate-900'}">${ing}</span>
        </label>`;
    }

    function rendreCourses() {
      const joursAffiches = menuSemaine.filter((_, idx) => joursSelectionnes.includes(idx));
      document.getElementById("active-days-tag").innerText = joursAffiches.length === 7 ? "Toute la semaine" : joursAffiches.map(j => j.jour.split(' ')[0]).join(', ');

      const tousIngs = [];
      joursAffiches.forEach(m => tousIngs.push(...ingredientsDuJour(m)));
      const ingsUniques = [...new Set(tousIngs)];

      const aAcheter = ingsUniques.filter(i => !etatStock[i]);
      const achetes = ingsUniques.filter(i => etatStock[i]);

      const groupes = {};
      aAcheter.forEach(i => { const r = rayonPour(i); (groupes[r] = groupes[r] || []).push(i); });

      document.getElementById("list-a-acheter").innerHTML = ORDRE_RAYONS
        .filter(r => groupes[r] && groupes[r].length)
        .map(r => `
          <div>
            <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">${r}</p>
            <div class="divide-y divide-slate-50">${groupes[r].map(i => itemHTML(i, false)).join('')}</div>
          </div>`).join('') || '<p class="text-xs text-slate-400 py-2 font-medium">Tout est dans le panier ✅</p>';

      document.getElementById("list-en-stock").innerHTML = achetes.length
        ? achetes.map(i => itemHTML(i, true)).join('')
        : '<p class="text-xs text-slate-300 py-2 font-medium">Rien coché pour l\'instant.</p>';

      document.getElementById("count-a-acheter").innerText = aAcheter.length;
      const total = ingsUniques.length, done = achetes.length;
      document.getElementById("progress-label").innerText = `${done} / ${total} achetés`;
      document.getElementById("progress-bar").style.width = total ? `${Math.round(done / total * 100)}%` : "0%";
    }

    function toggleStock(ing) {
      etatStock[ing] = !etatStock[ing];
      persister();
      rendreCourses();
    }

    // GESTION DES CLICS SUR L'APPLICATION
    document.addEventListener("click", (e) => {
      const selectDay = e.target.closest("[data-select-day]");
      if (selectDay) {
        jourActiveIndex = Number(selectDay.dataset.selectDay);
        persister();
        rendreVueJour();
        return;
      }
      const switchToDay = e.target.closest("[data-switch-to-day]");
      if (switchToDay) {
        jourActiveIndex = Number(switchToDay.dataset.switchToDay);
        persister();
        setTab("jour");
        return;
      }
      const regen = e.target.closest("[data-regen]");
      if (regen) { regenererJour(Number(regen.dataset.regen)); return; }
      
      const modal = e.target.closest("[data-modal]");
      if (modal) { ouvrirModal(Number(modal.dataset.modal), modal.dataset.type); }
    });

    document.getElementById("days-filter").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-jour]");
      if (btn) toggleJourSelection(Number(btn.dataset.jour));
    });

    document.getElementById("btn-toggle-all-days").addEventListener("click", () => {
      joursSelectionnes = joursSelectionnes.length === 7 ? [0] : [0, 1, 2, 3, 4, 5, 6];
      persister();
      rendreFiltresJours();
      rendreCourses();
    });

    document.getElementById("section-courses").addEventListener("change", (e) => {
      if (e.target.matches("input[data-ing]")) toggleStock(e.target.dataset.ing);
    });

    document.getElementById("btn-vider-panier").addEventListener("click", () => {
      etatStock = {};
      persister();
      rendreCourses();
    });

    document.getElementById("btn-reset-all").addEventListener("click", () => {
      if (confirm("Générer une toute nouvelle semaine ? La liste de courses sera réinitialisée.")) {
        menuSemaine = genererMenuSemaineDynamique();
        etatStock = {};
        joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
        jourActiveIndex = meGetJourActuelIndex();
        persister();
        rendreMenuComplet();
      }
    });

    // NAVIGATION ANGLAIS APPLI
    function setTab(tab) {
      document.getElementById("section-jour").classList.toggle("hidden", tab !== "jour");
      document.getElementById("section-semaine").classList.toggle("hidden", tab !== "semaine");
      document.getElementById("section-courses").classList.toggle("hidden", tab !== "courses");

      const tabs = { jour: "tab-jour", semaine: "tab-semaine", courses: "tab-courses" };
      Object.keys(tabs).forEach(k => {
        const el = document.getElementById(tabs[k]);
        if (k === tab) {
          el.className = "w-1/3 py-2.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all duration-200 flex items-center justify-center gap-1.5 font-extrabold";
        } else {
          el.className = "w-1/3 py-2.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 flex items-center justify-center gap-1.5";
        }
      });
      if (tab === "jour") rendreVueJour();
    }

    document.getElementById("tab-jour").addEventListener("click", () => setTab("jour"));
    document.getElementById("tab-semaine").addEventListener("click", () => setTab("semaine"));
    document.getElementById("tab-courses").addEventListener("click", () => setTab("courses"));

    rendreMenuComplet();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu & Market — Chef Personnel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .badge-shabbat { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%); color: #B45309; border: 1px solid #FDE68A; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    .card-shadow { box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03); }
    .modal-shadow { box-shadow: 0 -10px 40px -5px rgba(15, 23, 42, 0.25); }
    @media (min-width: 640px) { .modal-shadow { box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-full pb-28 selection:bg-emerald-500 selection:text-white">

  <!-- En-tête Fixe -->
  <header class="glass-header sticky top-0 z-30 border-b border-slate-200/80 px-4 py-3.5 transition-all">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <p id="header-saison" class="text-[11px] font-bold text-emerald-700 tracking-wider uppercase">Chef Personnel</p>
        </div>
        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Menu & Market</h1>
      </div>
      <button id="btn-reset-all" class="p-2.5 rounded-2xl bg-slate-100/80 hover:bg-rose-50 hover:text-rose-600 text-slate-600 transition-all duration-200 border border-slate-200/60 active:scale-95 flex items-center justify-center group" title="Générer une nouvelle semaine">
        <svg class="w-5 h-5 transition-transform group-hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-md mx-auto px-4 pt-5 space-y-5">

    <!-- Onglets de Navigation -->
    <div class="bg-slate-200/70 p-1 rounded-2xl flex text-xs font-bold shadow-inner">
      <button id="tab-menu" class="w-1/2 py-2.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
        <span>📅</span> Menu Semaine
      </button>
      <button id="tab-courses" class="w-1/2 py-2.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 flex items-center justify-center gap-2">
        <span>🛒</span> Liste de courses
      </button>
    </div>

    <!-- SECTION MENU -->
    <div id="section-menu" class="space-y-4">
      <div class="bg-emerald-50/70 border border-emerald-200/60 rounded-2xl px-4 py-3 text-xs text-emerald-900 leading-relaxed flex items-center gap-3 shadow-sm">
        <div class="p-2 bg-emerald-100/80 text-emerald-700 rounded-xl shrink-0">🎓</div>
        <div>
          <strong class="font-bold">Mode Apprentis :</strong> Catalogue étendu à 28 repas complets. Clique sur <span class="inline-block bg-white px-1 py-0.5 rounded border border-emerald-200 text-[10px]">🔄</span> pour faire varier une journée.
        </div>
      </div>
      <div id="cards-container" class="space-y-4"></div>
    </div>

    <!-- SECTION COURSES -->
    <div id="section-courses" class="hidden space-y-5">

      <!-- Filtres Jours & Progression -->
      <div class="bg-white p-4 rounded-3xl card-shadow border border-slate-200/60 space-y-3">
        <div class="flex justify-between items-center">
          <label class="block text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">🎯 Sélectionner les jours :</label>
          <button id="btn-toggle-all-days" class="text-[11px] font-bold text-emerald-600 hover:text-emerald-700 transition">Tout sélectionner</button>
        </div>
        <div id="days-filter" class="flex gap-1.5 overflow-x-auto hide-scrollbar py-1"></div>
        <div class="pt-2 border-t border-slate-100">
          <div class="flex justify-between items-center text-[11px] font-semibold text-slate-500 mb-1.5">
            <span id="progress-label" class="font-bold text-slate-700">0 / 0 achetés</span>
            <span id="active-days-tag" class="bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-full font-bold border border-emerald-100 text-[10px]"></span>
          </div>
          <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200/40">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full transition-all duration-300" style="width:0%"></div>
          </div>
        </div>
      </div>

            À acheter

        </h2>
        <div id="list-a-acheter" class="space-y-4"></div>
      </div>

      <!-- Dans le panier -->
      <div class="bg-white p-5 rounded-3xl card-shadow border border-slate-200/60 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <h2 class="font-bold text-slate-400 text-sm flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
            Dans le panier
          </h2>
          <button id="btn-vider-panier" class="text-[11px] font-bold text-slate-400 hover:text-rose-500 transition">Tout décocher</button>
        </div>
        <div id="list-en-stock" class="space-y-1 divide-y divide-slate-50 text-slate-400"></div>
      </div>

    </div>
  </main>

  <!-- MODALE RECETTE -->

    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] sm:max-h-[90vh] overflow-y-auto p-6 space-y-5 modal-shadow relative animate-in fade-in slide-in-from-bottom-5 duration-200">
      
      <!-- Poignée visuelle pour mobile -->
      <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto -mt-2 mb-2 sm:hidden"></div>

      <div class="sticky top-0 bg-white z-10 -mx-6 -mt-4 p-6 pt-2 pb-4 border-b border-slate-100 flex justify-between items-start">
        <div class="space-y-1 pr-4">

        </div>
        <button id="close-modal" class="p-2 -mr-2 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition active:scale-95">✕</button>
      </div>

      <!-- Stats -->
      <div id="modal-stats" class="grid grid-cols-3 gap-2"></div>

      <!-- Matériel -->
      <div id="modal-materiel-wrap">
        <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>🧰</span> Matériel nécessaire
        </h3>
        <div id="modal-materiel" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- Ingrédients -->
      <div>
        <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
          <span>🥑 Ingrédients</span>
          <span class="text-[10px] text-slate-400 normal-case font-semibold">(pour 2 personnes)</span>
        </h3>
        <ul id="modal-ingredients" class="grid grid-cols-1 gap-1.5 text-xs text-slate-700 font-medium"></ul>
      </div>

      <div id="modal-miseenplace-wrap">
        <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>📋</span> Mise en place <span class="text-[10px] text-slate-400 normal-case font-semibold">(Avant la cuisson)</span>
        </h3>
        <ul id="modal-miseenplace" class="space-y-1.5 text-xs text-slate-600"></ul>
      </div>

      <!-- Pas-à-pas -->
      <div>
        <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <span>👩‍🍳</span> Pas-à-pas guidé
        </h3>
        <ol id="modal-etapes" class="space-y-3 text-xs text-slate-600 pl-4 list-decimal marker:font-bold marker:text-emerald-600 leading-relaxed"></ol>
      </div>

      <!-- Astuce Chef -->
      <div id="modal-astuce"></div>
    </div>
  </div>

      if (mois >= 2 && mois <= 4) return "printemps";
      if (mois >= 5 && mois <= 7) return "ete";
      if (mois >= 8 && mois <= 10) return "automne";
      return "hiver";

    function formatTemps(min) {
      if (!min || min <= 0) return "—";
      if (min < 60) return `${min} min`;
      const h = Math.floor(min / 60), m = min % 60;

    function badgeTemps(t) {
      if (t <= 35) return { classe: "bg-emerald-50 text-emerald-700 border-emerald-200/60" };
      if (t <= 45) return { classe: "bg-amber-50 text-amber-700 border-amber-200/60" };
      return { classe: "bg-rose-50 text-rose-700 border-rose-200/60" };
    }

    const RAYONS = [
      { nom: "🥬 Fruits & Légumes", mots: ["asperge","radis","épinard","courgette","tomate","poivron","concombre","aubergine","carotte","fenouil","petits pois","fèves","avocat","patate douce","potimarron","potiron","butternut","champignon","panais","poireau","pomme de terre","oignon","échalote","ail","citron","basilic","menthe","coriandre","aneth","persil","ciboulette","gingembre","pousses","mesclun","salade","maïs","céleri","haricots verts","fraise","pêche","melon","pastèque","poire","pomme","orange","clémentine","kiwi","raisin","figue","abricot","endive","mâche","navet","chou","choucroute","ananas","brugnon"] },
      { nom: "🐟 Poissons & Viandes", mots: ["poulet","truite","saumon","cabillaud","dinde","bœuf","boeuf","lieu","dorade","poisson","cuisse","steak","crevette","thon","rumsteck"] },
      { nom: "🧀 Frais & Crèmerie", mots: ["feta","mozzarella","yaourt","fromage blanc","œuf","oeuf","tofu","edamame","chèvre","beurre","parmesan","ricotta"] },
      { nom: "🌾 Épicerie & Secs", mots: ["quinoa","riz","boulgour","semoule","lentille","pois chiche","pois cassé","haricot","tahini","houmous","huile","vinaigre","graine","sésame","noix","noisette","amande","pignon","granola","miel","sucre","cannelle","muscade","curcuma","cumin","curry","paprika","zaatar","chili","tamari","soja","sauce","chocolat","citron confit","lait de coco","moutarde","balsamique","laurier","thym","bouillon","épices","datte","fleur d'oranger","pita","challah","pain","croûtons","chapelure","levure","pruneau","olive","grenade"] }
    ];
    const ORDRE_RAYONS = ["🥬 Fruits & Légumes","🐟 Poissons & Viandes","🧀 Frais & Crèmerie","🌾 Épicerie & Secs","🛒 Autres"];
    
    function rayonPour(ing) {
      const s = ing.toLowerCase();
      for (const r of RAYONS) if (r.mots.some(m => s.includes(m))) return r.nom;
      return "🛒 Autres";
    }
    function ingredientsDuJour(item) {
      return [...item.entree.ingredients, ...item.plat.ingredients, ...(item.dessert ? item.dessert.ingredients : [])];
    }

    const STORAGE_KEY = "menu-market-v6";
    function safeGet() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { return null; } }
    function safeSet(obj) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch {} }
    function persister() { safeSet({ menuSemaine, etatStock, joursSelectionnes, saison: saisonActuelle }); }

    const saisonActuelle = obtenirSaisonActuelle();
    const poolRecettesSaison = catalogueSaisons[saisonActuelle] || catalogueSaisons["printemps"];

    function tirerRecette(pool, exclureNom) {
      const dispo = pool.filter(r => r.plat.nom !== exclureNom);
      const source = dispo.length ? dispo : pool;
      return source[Math.floor(Math.random() * source.length)];
    }

    function genererMenuSemaineDynamique() {
      const jours = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi (Shabbat)","Samedi","Dimanche"];
      let dernier = null;
      return jours.map((jour, index) => {
        if (index === 4) {
          const shab = recettesShabbat[Math.floor(Math.random() * recettesShabbat.length)];
          return { id: index, jour, ...shab };
        }
        const r = tirerRecette(poolRecettesSaison, dernier);
        dernier = r.plat.nom;
        return { id: index, jour, ...r };
      });
    }

    let menuSemaine, etatStock, joursSelectionnes;
    const sauvegarde = safeGet();
    if (sauvegarde && Array.isArray(sauvegarde.menuSemaine) && sauvegarde.menuSemaine.length) {
      menuSemaine = sauvegarde.menuSemaine;
      etatStock = sauvegarde.etatStock || {};
      joursSelectionnes = sauvegarde.joursSelectionnes || [0, 1, 2, 3, 4, 5, 6];
    } else {
      menuSemaine = genererMenuSemaineDynamique();
      etatStock = {};
      joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
    }

    function ligneMeta(plat) {
      const d = DIFFICULTES[plat.difficulte] || DIFFICULTES[1];
      return `<div class="flex items-center gap-2 mt-1.5">
        <span class="text-[10px] font-bold text-slate-500 bg-slate-100/80 px-2 py-0.5 rounded-md border border-slate-200/40">⏱️ ${formatTemps(plat.prep + plat.cuisson)}</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${d.classe}">${d.label}</span>
      </div>`;
    }

    function rendreMenu() {
      document.getElementById("header-saison").innerText = `Chef Personnel • Saison ${cap(saisonActuelle)}`;
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      menuSemaine.forEach((item, index) => {
        const estShabbat = item.jour.includes("Vendredi");
        const t = tempsRepas(item);
        const bt = badgeTemps(t);
        const chipTemps = estShabbat
          ? `<span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full badge-shabbat flex items-center gap-1 inline-flex">🕯️ Repas de fête</span>`
          : `<span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${bt.classe} inline-flex items-center gap-1">⏱️ Repas prêt en ~${t} min</span>`;

        container.innerHTML += `
          <div class="bg-white rounded-3xl p-5 card-shadow border border-slate-200/60 transition duration-200 space-y-3.5">
            <div class="flex justify-between items-start gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-base text-slate-900 tracking-tight">${item.jour}</span>
                  ${estShabbat ? '<span class="badge-shabbat text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">Shabbat</span>' : ''}
                </div>
                <div class="mt-1">${chipTemps}</div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <span class="text-[10px] font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200/40">${item.cuisine}</span>
                <button data-regen="${index}" class="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-xl transition-all active:scale-90" title="Changer ce menu">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
              </div>
            </div>

            <div class="space-y-2 text-xs">
              <div class="bg-slate-50 p-3 rounded-2xl flex justify-between items-center gap-2 border border-slate-100">
                <div class="min-w-0">
                  <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">Entrée</span>
                  <p class="font-bold text-slate-800 leading-tight mt-0.5">${item.entree.nom}</p>
                  ${ligneMeta(item.entree)}
                </div>
                <button data-modal="${index}" data-type="entree" class="shrink-0 text-emerald-700 hover:text-emerald-800 font-bold text-[11px] px-3 py-1.5 bg-white rounded-xl border border-slate-200/80 shadow-sm active:scale-95 transition">Recette ➔</button>
              </div>

              <div class="bg-emerald-50/40 p-3 rounded-2xl flex justify-between items-center gap-2 border border-emerald-100/80">
                <div class="min-w-0">
                  <span class="text-[9px] font-extrabold text-emerald-600 uppercase tracking-wider">Plat principal</span>
                  <p class="font-bold text-slate-900 leading-tight mt-0.5">${item.plat.nom}</p>
                  ${ligneMeta(item.plat)}
                </div>
                <button data-modal="${index}" data-type="plat" class="shrink-0 text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-[11px] px-3 py-1.5 rounded-xl shadow-sm active:scale-95 transition">Recette ➔</button>
              </div>

              ${item.dessert ? `
              <div class="bg-rose-50/30 p-3 rounded-2xl border border-rose-100/60">
                <div class="flex items-center justify-between">
                  <span class="text-[9px] font-extrabold text-rose-500 uppercase tracking-wider">🍰 Dessert</span>
                  <span class="text-[10px] font-bold text-slate-400">⏱️ ${formatTemps(item.dessert.prep)} · sans cuisson</span>
                </div>
                <p class="font-bold text-slate-800 leading-tight mt-0.5">${item.dessert.nom}</p>
              </div>` : ''}
            </div>

            <details class="group pt-1">
              <summary class="text-[11px] font-bold text-slate-400 hover:text-slate-600 cursor-pointer list-none flex justify-between items-center pt-2 border-t border-slate-100 transition">
                <span>🛒 Ingrédients du jour</span>
                <span class="transition-transform duration-200 group-open:rotate-180 text-xs">▼</span>
              </summary>
              <div class="mt-2.5 text-xs bg-slate-50/80 p-3 rounded-2xl border border-slate-100">
                <div class="flex flex-wrap gap-1.5">
                  ${ingredientsDuJour(item).map(ing => `<span class="bg-white px-2.5 py-1 rounded-lg border border-slate-200/60 text-slate-700 text-[11px] font-medium shadow-2xs">${ing}</span>`).join('')}
                </div>
              </div>
            </details>
          </div>`;
      });

      rendreFiltresJours();
      rendreCourses();
    }

    function statCard(label, valeur, extraClasse) {
      return `<div class="rounded-2xl p-3 text-center border ${extraClasse || 'bg-slate-50 border-slate-100'}">
        <p class="text-[9px] font-extrabold uppercase tracking-wider opacity-60">${label}</p>
        <p class="text-xs font-extrabold mt-0.5">${valeur}</p>
      </div>`;
    }

    function ouvrirModal(jourIndex, type) {
      const item = menuSemaine[jourIndex];
      const data = type === "entree" ? item.entree : item.plat;
      const d = DIFFICULTES[data.difficulte] || DIFFICULTES[1];

      document.getElementById("modal-badge").innerText = `${item.jour.split(' ')[0]} • ${type === "entree" ? "Entrée" : "Plat Principal"}`;
      document.getElementById("modal-title").innerText = data.nom;

      document.getElementById("modal-stats").innerHTML =
        statCard("Préparation", formatTemps(data.prep)) +
        statCard("Cuisson", formatTemps(data.cuisson)) +
        statCard("Niveau", d.label, d.classe);

      const matWrap = document.getElementById("modal-materiel-wrap");
      const matEl = document.getElementById("modal-materiel");
      if (data.materiel && data.materiel.length) {
        matWrap.classList.remove("hidden");
        matEl.innerHTML = data.materiel.map(m => `<span class="bg-slate-100/80 text-slate-700 px-2.5 py-1 rounded-xl text-[11px] font-semibold border border-slate-200/60">🔨 ${m}</span>`).join('');
      } else {
        matWrap.classList.add("hidden");
      }

      document.getElementById("modal-ingredients").innerHTML = data.ingredients.map(ing => `
        <li class="flex items-center gap-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
          <span>${ing}</span>
        </li>`).join('');

      const mepWrap = document.getElementById("modal-miseenplace-wrap");
      const mepEl = document.getElementById("modal-miseenplace");
      if (data.miseenplace && data.miseenplace.length) {
        mepWrap.classList.remove("hidden");
        mepEl.innerHTML = data.miseenplace.map(m => `<li class="flex items-start gap-2 bg-slate-50/70 p-2.5 rounded-xl border border-slate-100"><span class="text-emerald-600 font-bold shrink-0">✓</span><span>${m}</span></li>`).join('');
      } else {
        mepWrap.classList.add("hidden");
      }

      document.getElementById("modal-etapes").innerHTML = data.etapes.map(et => `<li class="pl-1 leading-relaxed">${et}</li>`).join('');

      document.getElementById("modal-astuce").innerHTML = data.astuce ? `
        <div class="bg-amber-50/70 border border-amber-200/60 rounded-2xl p-4 space-y-1">
          <p class="text-[10px] font-extrabold text-amber-700 uppercase tracking-wider flex items-center gap-1.5">
            <span>💡</span> Le geste du chef
          </p>
          <p class="text-xs text-amber-900 leading-relaxed font-medium">${data.astuce}</p>
        </div>` : '';

      document.getElementById("modal-recette").classList.remove("hidden");
    }
    document.getElementById("close-modal").addEventListener("click", () => document.getElementById("modal-recette").classList.add("hidden"));
    document.getElementById("modal-recette").addEventListener("click", (e) => { if (e.target.id === "modal-recette") e.currentTarget.classList.add("hidden"); });

    function regenererJour(index) {
      if (index === 4) {
        const shab = recettesShabbat[Math.floor(Math.random() * recettesShabbat.length)];
        menuSemaine[index] = { id: index, jour: menuSemaine[index].jour, ...shab };
      } else {
        const r = tirerRecette(poolRecettesSaison, menuSemaine[index].plat.nom);
        menuSemaine[index] = { ...menuSemaine[index], cuisine: r.cuisine, entree: r.entree, plat: r.plat, dessert: r.dessert };
      }
      persister();
      rendreMenu();
    }

    function rendreFiltresJours() {
      const container = document.getElementById("days-filter");
      container.innerHTML = "";
      menuSemaine.forEach((item, idx) => {
        const active = joursSelectionnes.includes(idx);
        container.innerHTML += `
          <button data-jour="${idx}" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${active ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200/70'}">
            ${item.jour.split(' ')[0]}
          </button>`;
      });

      const btnToggle = document.getElementById("btn-toggle-all-days");
      btnToggle.innerText = joursSelectionnes.length === 7 ? "Tout décocher" : "Tout sélectionner";
    }

    function toggleJourSelection(idx) {
      if (joursSelectionnes.includes(idx)) {
        if (joursSelectionnes.length > 1) {
          joursSelectionnes = joursSelectionnes.filter(i => i !== idx);
        }
      } else {
        joursSelectionnes.push(idx);
        joursSelectionnes.sort((a,b) => a - b);
      }
      persister();
      rendreFiltresJours();
      rendreCourses();
    }

    function toggleTousJours() {
      if (joursSelectionnes.length === 7) {
        joursSelectionnes = [0];
      } else {
        joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
      }
      persister();
      rendreFiltresJours();
      rendreCourses();
    }

    function itemHTML(ing, achete) {
      return `
        <label class="flex items-center gap-3 py-2.5 cursor-pointer group">
          <input type="checkbox" data-ing="${ing}" ${achete ? 'checked' : ''} class="w-4 h-4 rounded-md text-emerald-600 focus:ring-emerald-500 border-slate-300 transition">
          <span class="text-xs font-semibold transition ${achete ? 'line-through text-slate-400' : 'text-slate-700 group-hover:text-slate-900'}">${ing}</span>
        </label>`;
    }

    function rendreCourses() {
      const joursAffiches = menuSemaine.filter((_, idx) => joursSelectionnes.includes(idx));
      
      const tagText = joursAffiches.length === 7 
        ? "Toute la semaine" 
        : joursAffiches.map(j => j.jour.split(' ')[0]).join(', ');
      
      document.getElementById("active-days-tag").innerText = tagText;

      const tousIngs = [];
      joursAffiches.forEach(m => tousIngs.push(...ingredientsDuJour(m)));
      const ingsUniques = [...new Set(tousIngs)];

      const aAcheter = ingsUniques.filter(i => !etatStock[i]);
      const achetes = ingsUniques.filter(i => etatStock[i]);

      const groupes = {};
      aAcheter.forEach(i => { const r = rayonPour(i); (groupes[r] = groupes[r] || []).push(i); });

      const listAcheter = document.getElementById("list-a-acheter");
      listAcheter.innerHTML = ORDRE_RAYONS
        .filter(r => groupes[r] && groupes[r].length)
        .map(r => `
          <div>
            <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">${r}</p>
            <div class="divide-y divide-slate-50">${groupes[r].map(i => itemHTML(i, false)).join('')}</div>
          </div>`).join('') || '<p class="text-xs text-slate-400 py-2 font-medium">Tout est dans le panier ✅</p>';

      const listStock = document.getElementById("list-en-stock");
      listStock.innerHTML = achetes.length
        ? achetes.map(i => itemHTML(i, true)).join('')
        : '<p class="text-xs text-slate-300 py-2 font-medium">Rien coché pour l\'instant.</p>';

      document.getElementById("count-a-acheter").innerText = aAcheter.length;

      const total = ingsUniques.length;
      const done = achetes.length;
      document.getElementById("progress-label").innerText = `${done} / ${total} achetés`;
      document.getElementById("progress-bar").style.width = total ? `${Math.round(done / total * 100)}%` : "0%";
    }

    function toggleStock(ing) {
      etatStock[ing] = !etatStock[ing];
      persister();
      rendreCourses();
    }

    document.getElementById("cards-container").addEventListener("click", (e) => {
      const regen = e.target.closest("[data-regen]");
      if (regen) { regenererJour(Number(regen.dataset.regen)); return; }
      const modal = e.target.closest("[data-modal]");
      if (modal) { ouvrirModal(Number(modal.dataset.modal), modal.dataset.type); }
    });

    document.getElementById("days-filter").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-jour]");
      if (btn) toggleJourSelection(Number(btn.dataset.jour));
    });

    document.getElementById("btn-toggle-all-days").addEventListener("click", toggleTousJours);

    document.getElementById("section-courses").addEventListener("change", (e) => {
      if (e.target.matches("input[data-ing]")) toggleStock(e.target.dataset.ing);
    });

    document.getElementById("btn-vider-panier").addEventListener("click", () => {
      etatStock = {};
      persister();
      rendreCourses();
    });

    document.getElementById("btn-reset-all").addEventListener("click", () => {
      if (confirm("Générer une toute nouvelle semaine ? Ta liste de courses sera réinitialisée.")) {
        menuSemaine = genererMenuSemaineDynamique();
        etatStock = {};
        joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
        persister();
        rendreMenu();
      }
    });

    function setTab(tab) {
      const menu = tab === "menu";
      document.getElementById("section-menu").classList.toggle("hidden", !menu);
      document.getElementById("section-courses").classList.toggle("hidden", menu);
      document.getElementById("tab-menu").className = "w-1/2 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 " + (menu ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-800");
      document.getElementById("tab-courses").className = "w-1/2 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 " + (menu ? "text-slate-500 hover:text-slate-800" : "bg-white text-slate-900 shadow-sm");
    }
    document.getElementById("tab-menu").addEventListener("click", () => setTab("menu"));
    document.getElementById("tab-courses").addEventListener("click", () => setTab("courses"));

    rendreMenu();
  </script>
</body>
</html>

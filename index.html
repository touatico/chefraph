  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-full pb-28 selection:bg-emerald-500 selection:text-white">

        </div>
        <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Menu & Market</h1>
      </div>
      <button id="btn-reset-all" class="p-2.5 rounded-2xl bg-slate-100/80 hover:bg-rose-50 hover:text-rose-600 text-slate-600 transition-all duration-200 border border-slate-200/60 active:scale-95 flex items-center justify-center group" title="Générer une nouvelle semaine">

      </button>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-md mx-auto px-4 pt-5 space-y-5">

    <!-- Onglets de Navigation -->
    <div class="bg-slate-200/70 p-1 rounded-2xl flex text-xs font-bold shadow-inner">
      <button id="tab-menu" class="w-1/2 py-2.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
        <span>📅</span> Menu Semaine
      </button>
      <button id="tab-courses" class="w-1/2 py-2.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200 flex items-center justify-center gap-2">
        <span>🛒</span> Liste de courses
      </button>
    </div>

    <!-- SECTION MENU -->
    <div id="section-menu" class="space-y-4">
      <div class="bg-emerald-50/70 border border-emerald-200/60 rounded-2xl px-4 py-3 text-xs text-emerald-900 leading-relaxed flex items-center gap-3 shadow-sm">
        <div class="p-2 bg-emerald-100/80 text-emerald-700 rounded-xl shrink-0">🎓</div>
        <div>
          <strong class="font-bold">Mode Apprentis :</strong> Menu généré selon tes recettes. Cliquez sur <span class="inline-block bg-white px-1 py-0.5 rounded border border-emerald-200 text-[10px]">🔄</span> pour varier une journée.
        </div>
      </div>
      <div id="cards-container" class="space-y-4"></div>
    </div>

    <!-- SECTION COURSES -->
    <div id="section-courses" class="hidden space-y-5">

      if (mois >= 8 && mois <= 10) return "automne";

                  ${ligneMeta(item.entree)}
                </div>
                <button data-modal="${index}" data-type="entree" class="shrink-0 text-emerald-700 hover:text-emerald-800 font-bold text-[11px] px-3 py-1.5 bg-white rounded-xl border border-slate-200/80 shadow-sm active:scale-95 transition">Recette ➔</button>
              </div>

              <div class="bg-emerald-50/40 p-3 rounded-2xl flex justify-between items-center gap-2 border border-emerald-100/80">
                <div class="min-w-0">
                  <span class="text-[9px] font-extrabold text-emerald-600 uppercase tracking-wider">Plat principal</span>
                  <p class="font-bold text-slate-900 leading-tight mt-0.5">${item.plat.nom}</p>
                  ${ligneMeta(item.plat)}
                </div>
                <button data-modal="${index}" data-type="plat" class="shrink-0 text-white bg-emerald-600 hover:bg-emerald-700 font-bold text-[11px] px-3 py-1.5 rounded-xl shadow-sm active:scale-95 transition">Recette ➔</button>
              </div>

              ${item.dessert ? `
              <div class="bg-rose-50/30 p-3 rounded-2xl border border-rose-100/60">
                <div class="flex items-center justify-between">
                  <span class="text-[9px] font-extrabold text-rose-500 uppercase tracking-wider">🍰 Dessert</span>
                  <span class="text-[10px] font-bold text-slate-400">⏱️ ${formatTemps(item.dessert.prep)} · sans cuisson</span>
                </div>
                <p class="font-bold text-slate-800 leading-tight mt-0.5">${item.dessert.nom}</p>
              </div>` : ''}
            </div>

            <details class="group pt-1">
              <summary class="text-[11px] font-bold text-slate-400 hover:text-slate-600 cursor-pointer list-none flex justify-between items-center pt-2 border-t border-slate-100 transition">
                <span>🛒 Ingrédients du jour</span>
                <span class="transition-transform duration-200 group-open:rotate-180 text-xs">▼</span>
              </summary>
              <div class="mt-2.5 text-xs bg-slate-50/80 p-3 rounded-2xl border border-slate-100">
                <div class="flex flex-wrap gap-1.5">
                  ${ingredientsDuJour(item).map(ing => `<span class="bg-white px-2.5 py-1 rounded-lg border border-slate-200/60 text-slate-700 text-[11px] font-medium shadow-2xs">${ing}</span>`).join('')}
                </div>
              </div>
            </details>
          </div>`;
      });

      rendreFiltresJours();
      rendreCourses();
    }

    function statCard(label, valeur, extraClasse) {
      return `<div class="rounded-2xl p-3 text-center border ${extraClasse || 'bg-slate-50 border-slate-100'}">
        <p class="text-[9px] font-extrabold uppercase tracking-wider opacity-60">${label}</p>
        <p class="text-xs font-extrabold mt-0.5">${valeur}</p>
      </div>`;
    }

    function ouvrirModal(jourIndex, type) {
      const item = menuSemaine[jourIndex];
      const data = type === "entree" ? item.entree : item.plat;
      const d = DIFFICULTES[data.difficulte] || DIFFICULTES[1];

      document.getElementById("modal-badge").innerText = `${item.jour.split(' ')[0]} • ${type === "entree" ? "Entrée" : "Plat Principal"}`;
      document.getElementById("modal-title").innerText = data.nom;

      document.getElementById("modal-stats").innerHTML =
        statCard("Préparation", formatTemps(data.prep)) +
        statCard("Cuisson", formatTemps(data.cuisson)) +
        statCard("Niveau", d.label, d.classe);

      const matWrap = document.getElementById("modal-materiel-wrap");
      const matEl = document.getElementById("modal-materiel");
      if (data.materiel && data.materiel.length) {
        matWrap.classList.remove("hidden");
        matEl.innerHTML = data.materiel.map(m => `<span class="bg-slate-100/80 text-slate-700 px-2.5 py-1 rounded-xl text-[11px] font-semibold border border-slate-200/60">🔨 ${m}</span>`).join('');
      } else {
        matWrap.classList.add("hidden");
      }

      document.getElementById("modal-ingredients").innerHTML = data.ingredients.map(ing => `
        <li class="flex items-center gap-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
          <span>${ing}</span>
        </li>`).join('');

      const mepWrap = document.getElementById("modal-miseenplace-wrap");
      const mepEl = document.getElementById("modal-miseenplace");
      if (data.miseenplace && data.miseenplace.length) {
        mepWrap.classList.remove("hidden");
        mepEl.innerHTML = data.miseenplace.map(m => `<li class="flex items-start gap-2 bg-slate-50/70 p-2.5 rounded-xl border border-slate-100"><span class="text-emerald-600 font-bold shrink-0">✓</span><span>${m}</span></li>`).join('');
      } else {
        mepWrap.classList.add("hidden");
      }

      document.getElementById("modal-etapes").innerHTML = data.etapes.map(et => `<li class="pl-1 leading-relaxed">${et}</li>`).join('');

      document.getElementById("modal-astuce").innerHTML = data.astuce ? `
        <div class="bg-amber-50/70 border border-amber-200/60 rounded-2xl p-4 space-y-1">
          <p class="text-[10px] font-extrabold text-amber-700 uppercase tracking-wider flex items-center gap-1.5">
            <span>💡</span> Le geste du chef
          </p>
          <p class="text-xs text-amber-900 leading-relaxed font-medium">${data.astuce}</p>
        </div>` : '';

      document.getElementById("modal-recette").classList.remove("hidden");
    }
    document.getElementById("close-modal").addEventListener("click", () => document.getElementById("modal-recette").classList.add("hidden"));
    document.getElementById("modal-recette").addEventListener("click", (e) => { if (e.target.id === "modal-recette") e.currentTarget.classList.add("hidden"); });

    function regenererJour(index) {
      if (index === 4) {
        const shab = recettesShabbat[Math.floor(Math.random() * recettesShabbat.length)];
        menuSemaine[index] = { id: index, jour: menuSemaine[index].jour, ...shab };
      } else {
        const r = tirerRecette(poolRecettesSaison, menuSemaine[index].plat.nom);
        menuSemaine[index] = { ...menuSemaine[index], cuisine: r.cuisine, entree: r.entree, plat: r.plat, dessert: r.dessert };
      }
      persister();
      rendreMenu();
    }

    function rendreFiltresJours() {
      const container = document.getElementById("days-filter");
      container.innerHTML = "";
      menuSemaine.forEach((item, idx) => {
        const active = joursSelectionnes.includes(idx);
        container.innerHTML += `
          <button data-jour="${idx}" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${active ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200/70'}">
            ${item.jour.split(' ')[0]}
          </button>`;
      });

      const btnToggle = document.getElementById("btn-toggle-all-days");
      btnToggle.innerText = joursSelectionnes.length === 7 ? "Tout décocher" : "Tout sélectionner";
    }

    function toggleJourSelection(idx) {
      if (joursSelectionnes.includes(idx)) {
        if (joursSelectionnes.length > 1) {
          joursSelectionnes = joursSelectionnes.filter(i => i !== idx);
        }
      } else {
        joursSelectionnes.push(idx);
        joursSelectionnes.sort((a,b) => a - b);
      }
      persister();
      rendreFiltresJours();
      rendreCourses();
    }

    function toggleTousJours() {
      if (joursSelectionnes.length === 7) {
        joursSelectionnes = [0];
      } else {
        joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
      }
      persister();
      rendreFiltresJours();
      rendreCourses();
    }

    function itemHTML(ing, achete) {
      return `
        <label class="flex items-center gap-3 py-2.5 cursor-pointer group">
          <input type="checkbox" data-ing="${ing}" ${achete ? 'checked' : ''} class="w-4 h-4 rounded-md text-emerald-600 focus:ring-emerald-500 border-slate-300 transition">
          <span class="text-xs font-semibold transition ${achete ? 'line-through text-slate-400' : 'text-slate-700 group-hover:text-slate-900'}">${ing}</span>
        </label>`;
    }

    function rendreCourses() {
      const joursAffiches = menuSemaine.filter((_, idx) => joursSelectionnes.includes(idx));
      
      const tagText = joursAffiches.length === 7 
        ? "Toute la semaine" 
        : joursAffiches.map(j => j.jour.split(' ')[0]).join(', ');
      
      document.getElementById("active-days-tag").innerText = tagText;

      const tousIngs = [];
      joursAffiches.forEach(m => tousIngs.push(...ingredientsDuJour(m)));
      const ingsUniques = [...new Set(tousIngs)];

      const aAcheter = ingsUniques.filter(i => !etatStock[i]);
      const achetes = ingsUniques.filter(i => etatStock[i]);

      const groupes = {};
      aAcheter.forEach(i => { const r = rayonPour(i); (groupes[r] = groupes[r] || []).push(i); });

      const listAcheter = document.getElementById("list-a-acheter");
      listAcheter.innerHTML = ORDRE_RAYONS
        .filter(r => groupes[r] && groupes[r].length)
        .map(r => `
          <div>
            <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">${r}</p>
            <div class="divide-y divide-slate-50">${groupes[r].map(i => itemHTML(i, false)).join('')}</div>
          </div>`).join('') || '<p class="text-xs text-slate-400 py-2 font-medium">Tout est dans le panier ✅</p>';

      const listStock = document.getElementById("list-en-stock");
      listStock.innerHTML = achetes.length
        ? achetes.map(i => itemHTML(i, true)).join('')
        : '<p class="text-xs text-slate-300 py-2 font-medium">Rien coché pour l\'instant.</p>';

      document.getElementById("count-a-acheter").innerText = aAcheter.length;

      const total = ingsUniques.length;
      const done = achetes.length;
      document.getElementById("progress-label").innerText = `${done} / ${total} achetés`;
      document.getElementById("progress-bar").style.width = total ? `${Math.round(done / total * 100)}%` : "0%";
    }

    function toggleStock(ing) {
      etatStock[ing] = !etatStock[ing];
      persister();
      rendreCourses();
    }

    document.getElementById("cards-container").addEventListener("click", (e) => {
      const regen = e.target.closest("[data-regen]");
      if (regen) { regenererJour(Number(regen.dataset.regen)); return; }
      const modal = e.target.closest("[data-modal]");
      if (modal) { ouvrirModal(Number(modal.dataset.modal), modal.dataset.type); }
    });

    document.getElementById("days-filter").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-jour]");
      if (btn) toggleJourSelection(Number(btn.dataset.jour));
    });

    document.getElementById("btn-toggle-all-days").addEventListener("click", toggleTousJours);

    document.getElementById("section-courses").addEventListener("change", (e) => {
      if (e.target.matches("input[data-ing]")) toggleStock(e.target.dataset.ing);
    });

    document.getElementById("btn-vider-panier").addEventListener("click", () => {
      etatStock = {};
      persister();
      rendreCourses();
    });

    document.getElementById("btn-reset-all").addEventListener("click", () => {
      if (confirm("Générer une toute nouvelle semaine ? Ta liste de courses sera réinitialisée.")) {
        menuSemaine = genererMenuSemaineDynamique();
        etatStock = {};
        joursSelectionnes = [0, 1, 2, 3, 4, 5, 6];
        persister();
        rendreMenu();
      }
    });

    function setTab(tab) {
      const menu = tab === "menu";
      document.getElementById("section-menu").classList.toggle("hidden", !menu);
      document.getElementById("section-courses").classList.toggle("hidden", menu);
      document.getElementById("tab-menu").className = "w-1/2 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 " + (menu ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-800");
      document.getElementById("tab-courses").className = "w-1/2 py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 " + (menu ? "text-slate-500 hover:text-slate-800" : "bg-white text-slate-900 shadow-sm");
    }
    document.getElementById("tab-menu").addEventListener("click", () => setTab("menu"));
    document.getElementById("tab-courses").addEventListener("click", () => setTab("courses"));

    rendreMenu();
  </script>
</body>
</html>

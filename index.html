<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificateur de Repas de Saison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --primary: #0F172A;
            --primary-muted: #475569;
            --accent: #10B981;
            --accent-hover: #059669;
            --accent-light: #ECFDF5;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--primary-muted);
            font-size: 1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            max-width: 450px;
            margin: 0 auto 40px auto;
        }

        select {
            appearance: none;
            background-color: var(--bg);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .meal-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meal-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .meal-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: var(--primary-muted);
        }

        .meal-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .badge {
            font-size: 0.75rem;
            background: var(--bg);
            color: var(--primary-muted);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .courses-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            list-style: none;
            margin-top: 16px;
        }

        .courses-grid li {
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .courses-grid li:hover {
            border-color: var(--border);
        }

        .courses-grid input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Planificateur de Repas</h1>
        <p class="subtitle">Organisez votre mois avec des produits frais et de saison</p>
    </header>
    
    <div class="controls">
        <select id="saisonSelect">
            <option value="printemps">🌸 Printemps</option>
            <option value="ete" selected>☀️ Été</option>
            <option value="automne">🍂 Automne</option>
            <option value="hiver">❄️ Hiver</option>
        </select>
        <button onclick="genererPlanning()">Générer</button>
    </div>

    <h2 class="section-title">Planning des menus</h2>
    <div id="planning" class="grid"></div>

    <div class="courses-section">
        <h2 class="section-title" style="margin-bottom: 0;">Liste de courses globale</h2>
        <ul id="listeCourses" class="courses-grid"></ul>
    </div>
</div>

<script>
const baseLegumes = {
    printemps: ["Asperges", "Radis", "Petits pois", "Epinards", "Artichauts", "Carottes fanes", "Fèves"],
    ete: ["Tomates", "Courgettes", "Poivrons", "Aubergines", "Concombres", "Haricots verts", "Maïs"],
    automne: ["Potimarron", "Champignons", "Châtaignes", "Chou frisé", "Poireaux", "Butternut", "Brocolis"],
    hiver: ["Endives", "Chou-fleur", "Navets", "Céleri-rave", "Panais", "Courge", "Chou de Bruxelles"]
};

const baseProteines = ["Poulet", "Saumon", "Pâtes", "Riz", "Lentilles", "Quinoa", "Œufs", "Pois chiches", "Tofu", "Bœuf"];
const baseDesserts = {
    printemps: "Fraises", ete: "Pêches", automne: "Pommes", hiver: "Poires"
};

function construireBaseDonnees() {
    const saisons = ["printemps", "ete", "automne", "hiver"];
    const db = {};

    saisons.forEach(saison => {
        db[saison] = [];
        let jourCompt = 1;

        for (let sem = 1; sem <= 4; sem++) {
            for (let j = 1; j <= 7; j++) {
                const veg = baseLegumes[saison][(j - 1) % baseLegumes[saison].length];
                const prot = baseProteines[(j + sem) % baseProteines.length];
                const fruit = baseDesserts[saison];

                db[saison].push({
                    jour: `Jour ${jourCompt}`,
                    semaine: `Semaine ${sem}`,
                    entree: { 
                        nom: `Salade de ${veg.toLowerCase()} crus`, 
                        prep: 10, 
                        ingredients: [`200g de ${veg.toLowerCase()}`, "Vinaigrette maison", "Huile d'olive"] 
                    },
                    plat: { 
                        nom: `${prot} poêlé et ${veg.toLowerCase()}`, 
                        prep: 25, 
                        ingredients: [`150g de ${prot.toLowerCase()}`, `250g de ${veg.toLowerCase()}`, "Ail & herbes"] 
                    },
                    dessert: { 
                        nom: `Dessert aux ${fruit.toLowerCase()}`, 
                        prep: 15, 
                        ingredients: [`2 ${fruit.toLowerCase()}`, "Sucre vanillé"] 
                    }
                });
                jourCompt++;
            }
        }
    });
    return db;
}

const catalogueSaisons = construireBaseDonnees();

function genererPlanning() {
    const saison = document.getElementById("saisonSelect").value;
    const mois = catalogueSaisons[saison] || [];
    
    const planningDiv = document.getElementById("planning");
    const listeCoursesUl = document.getElementById("listeCourses");
    
    planningDiv.innerHTML = "";
    listeCoursesUl.innerHTML = "";
    
    const tousLesIngredients = new Set();

    mois.forEach(menu => {
        const card = document.createElement("div");
        card.className = "card";
        
        card.innerHTML = `
            <div class="card-header">
                <span class="card-title">${menu.jour}</span>
                <span class="badge">${menu.semaine}</span>
            </div>
            <div class="meal-group">
                <div class="meal-item">
                    <span class="meal-type">Entrée</span>
                    <div class="meal-name">
                        <span>${menu.entree.nom}</span>
                        <span class="badge">${menu.entree.prep}m</span>
                    </div>
                </div>
                <div class="meal-item">
                    <span class="meal-type">Plat</span>
                    <div class="meal-name">
                        <span>${menu.plat.nom}</span>
                        <span class="badge">${menu.plat.prep}m</span>
                    </div>
                </div>
                <div class="meal-item">
                    <span class="meal-type">Dessert</span>
                    <div class="meal-name">
                        <span>${menu.dessert.nom}</span>
                        <span class="badge">${menu.dessert.prep}m</span>
                    </div>
                </div>
            </div>
        `;
        
        planningDiv.appendChild(card);

        menu.entree.ingredients.forEach(i => tousLesIngredients.add(i));
        menu.plat.ingredients.forEach(i => tousLesIngredients.add(i));
        menu.dessert.ingredients.forEach(i => tousLesIngredients.add(i));
    });

    Array.from(tousLesIngredients).sort().forEach(ing => {
        const li = document.createElement("li");
        li.innerHTML = `<input type="checkbox"> <span>${ing}</span>`;
        listeCoursesUl.appendChild(li);
    });
}

document.addEventListener("DOMContentLoaded", genererPlanning);
</script>

</body>
</html>
